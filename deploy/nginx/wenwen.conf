# 文问 nginx 站点配置（部署到 /etc/nginx/sites-available/wenwen.conf）
# 架构：nginx 是唯一公网入口；backend/frontend 只绑 127.0.0.1
# 端口说明：443 被 xray(REALITY) 占用，文问 HTTPS 使用 8443
# 证书：Let's Encrypt（certbot --nginx 签发，自动续期；80 端口仅用于 ACME 验证与跳转）

# 限速区：登录/注册防爆破（每 IP 每分钟 5 次）
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
# 限速区：普通 API（每 IP 每秒 10 次）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name wenwenpdf.top www.wenwenpdf.top;

    # ACME 续期路径
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 全部跳转 HTTPS（8443：443 被 xray REALITY 占用，见 deploy/README.md）
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name wenwenpdf.top www.wenwenpdf.top;

    ssl_certificate /etc/letsencrypt/live/wenwenpdf.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wenwenpdf.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 上传上限：免费版单文件 20MB
    client_max_body_size 20m;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- API：登录/注册单独限速 ----
    location ~ ^/api/auth/(register|login|verify-email|resend)$ {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/wenwen-proxy.conf;
    }

    # ---- API：其余接口 ----
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/wenwen-proxy.conf;
    }

    # ---- 前端 ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/wenwen-proxy.conf;
    }
}
